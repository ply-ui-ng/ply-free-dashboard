<!-- Uses the free form-signup block pattern. -->
<ply-card>
  <form class="p-8 flex flex-col h-full" (ngSubmit)="submit()">
    <h2 class="font-bold text-sm text-slate-900 dark:text-white mb-6 uppercase tracking-widest text-center">
      Sign Up
    </h2>

    <div class="flex gap-4 mb-4">
      <ply-input-group class="flex-1">
        <ply-label class="!text-[10px] uppercase !font-light !tracking-[2px]">First Name</ply-label>
        <input ply-input name="firstName" [(ngModel)]="firstName" placeholder="First Name" />
      </ply-input-group>
      <ply-input-group class="flex-1">
        <ply-label class="!text-[10px] uppercase !font-light !tracking-[2px]">Last Name</ply-label>
        <input ply-input name="lastName" [(ngModel)]="lastName" placeholder="Last Name" />
      </ply-input-group>
    </div>

    <ply-input-group class="mb-4">
      <ply-label class="!text-[10px] uppercase !font-light !tracking-[2px]">Email address</ply-label>
      <input ply-input name="email" type="email" [(ngModel)]="email" placeholder="Email address" required />
    </ply-input-group>

    <ply-input-group class="mb-6">
      <ply-label class="!text-[10px] uppercase !font-light !tracking-[2px]">Password</ply-label>
      <input
        ply-input
        name="password"
        type="password"
        [(ngModel)]="password"
        placeholder="Password"
        required />
    </ply-input-group>

    <button ply-button color="primary" type="submit" class="w-full py-3 mb-6 mt-auto">Sign Up</button>

    <p class="text-center text-[10px] uppercase font-light text-slate-400 tracking-widest">
      Already have an account?
      <a routerLink="/login" class="text-slate-900 dark:text-white">Log in</a>
    </p>
  </form>
</ply-card>
