<ply-dialog [width]="520">
  <ply-dialog-header>{{ isEdit ? 'Edit User' : 'Add User' }}</ply-dialog-header>
  <ply-dialog-body>
    <form id="user-form" class="space-y-4 p-1" (ngSubmit)="save()">
      <ply-input-group>
        <ply-label>Name</ply-label>
        <input ply-input name="name" [(ngModel)]="name" placeholder="Full name" required />
      </ply-input-group>
      <ply-input-group>
        <ply-label>Email</ply-label>
        <input ply-input name="email" type="email" [(ngModel)]="email" placeholder="Email" required />
      </ply-input-group>
      <div class="grid gap-4 sm:grid-cols-2">
        <ply-input-group>
          <ply-label>Role</ply-label>
          <select ply-input name="role" [(ngModel)]="role">
            @for (roleOption of roles; track roleOption) {
              <option [value]="roleOption">{{ roleOption }}</option>
            }
          </select>
        </ply-input-group>
        <ply-input-group>
          <ply-label>Status</ply-label>
          <select ply-input name="status" [(ngModel)]="status">
            @for (statusOption of statuses; track statusOption) {
              <option [value]="statusOption">{{ statusOption }}</option>
            }
          </select>
        </ply-input-group>
      </div>
    </form>
  </ply-dialog-body>
  <ply-dialog-footer>
    <button type="button" ply-stroked-button color="default" ply-dialog-close>Cancel</button>
    <button type="submit" form="user-form" ply-button color="primary">
      {{ isEdit ? 'Save Changes' : 'Create User' }}
    </button>
  </ply-dialog-footer>
</ply-dialog>
