<ply-dialog [width]="420">
  <ply-dialog-header>Delete User</ply-dialog-header>
  <ply-dialog-body>
    <p class="text-sm text-slate-600 dark:text-slate-300">
      Are you sure you want to delete
      <span class="font-semibold text-slate-900 dark:text-white">{{ user.name }}</span>? This action cannot be undone.
    </p>
  </ply-dialog-body>
  <ply-dialog-footer>
    <button type="button" ply-stroked-button color="default" ply-dialog-close>Cancel</button>
    <button type="button" ply-button color="danger" (click)="confirm()">Delete</button>
  </ply-dialog-footer>
</ply-dialog>
