<ply-card>
          <div class="p-8 flex flex-col h-full">
            <h3
              class="font-bold text-sm text-slate-900 dark:text-white mb-6 uppercase tracking-widest text-center">
              Sign Up</h3>
            <div class="flex gap-4 mb-4">
              <ply-input-group class="flex-1">
                <ply-label class="text-[10px]! uppercase font-light! tracking-[2px]!">First Name</ply-label>
                <input ply-input placeholder="First Name" />
              </ply-input-group>
              <ply-input-group class="flex-1">
                <ply-label class="text-[10px]! uppercase font-light! tracking-[2px]!">Last Name</ply-label>
                <input ply-input placeholder="Last Name" />
              </ply-input-group>
            </div>
            <ply-input-group class="mb-4">
              <ply-label class="text-[10px]! uppercase font-light! tracking-[2px]!">Email address</ply-label>
              <input ply-input placeholder="Email address" />
            </ply-input-group>
            <ply-input-group class="mb-6">
              <ply-label class="text-[10px]! uppercase font-light! tracking-[2px]!">Password</ply-label>
              <input ply-input type="password" placeholder="Password" />
            </ply-input-group>
            <button ply-button color="primary" class="w-full py-3 mb-6 mt-auto">Sign Up</button>
            <p class="text-center text-[10px] uppercase font-light text-slate-400 tracking-widest">Already have an
              account?
              <a href="#" class="text-slate-900 dark:text-white">Log in</a>
            </p>
          </div>
        </ply-card>
