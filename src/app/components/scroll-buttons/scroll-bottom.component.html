<button
  type="button"
  ply-icon-button
  [color]="color()"
  [size]="size()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-hidden]="!visible()"
  class="shadow-lg"
  (click)="scroll()">
  <ply-icon name="arrow-down" class="stroke-current"></ply-icon>
</button>
